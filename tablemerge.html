<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabel Merge A-Z</title>

<link rel="stylesheet" href="tablemerge.css">
</head>
<body>

<h1>Tabel Merge A-Z</h1>
<p class="subtitle">Belajar HTML dan CSS</p>

<table class="letter-table">
<tr>
<td rowspan="3" class="blue">A</td>
<td rowspan="2" class="blue">B</td>
<td colspan="2" class="blue">C</td>
<td rowspan="4" class="blue">D</td>
<td rowspan="4" class="blue">E</td>
<td colspan="1" rowspan="2" class="blue">N</td>
<td colspan="1" rowspan="7" class="blue">H</td>
</tr>

<tr>
<td colspan="1" class="aqua">F</td>
<td class="aqua">G</td>
</tr>

<tr>
<td class="blue">I</td>
<td class="blue">J</td>
<td class="blue">K</td>
</tr>

<tr>
<td colspan="5" class="aqua">M</td>
<td class="blue">O</td>
</tr>

<tr>
<td rowspan="5" class="blue">P</td>
<td colspan="2" class="blue">Q</td>
<td rowspan="5" class="blue">R</td>
<td rowspan="2" class="blue">U</td>
<td rowspan="2" class="blue">V</td>
<td rowspan="2" class="blue">W</td>
</tr>

<tr>
<td rowspan="2" class="aqua">S</td>
<td rowspan="2" class="aqua">T</td>
</tr>

<tr>
<td colspan="1" class="aqua">X</td>
<td colspan="1" class="aqua">Y</td>
<td colspan="1" class="aqua">Z</td>
</tr>
</table>

<p class="note">
Arahkan kursor ke kotak untuk melihat efek hover.
</p>

</body>
</html>
